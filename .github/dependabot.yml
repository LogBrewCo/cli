# Dependabot checks every ecosystem daily and opens one grouped pull request per
# ecosystem. It waits 7 days after a release, so a release that its publisher
# pulls or replaces within a week never lands. Security updates do not wait.
# scripts/check-dependabot.sh fails when a tracked manifest has no entry here.
# Each entry sets commit-message so commits and pull request titles read
# chore(deps): ...
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: bun
    directories:
      - /npm
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      bun:
        patterns: ["*"]
    ignore:
      # The release job sets these to the version it publishes.
      - dependency-name: "@logbrew/cli-*"
  - package-ecosystem: cargo
    directories:
      - /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo:
        patterns: ["*"]
