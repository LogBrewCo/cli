name: Advisories

# Scans the locked dependencies every day, so an advisory published after a
# change merged still fails within 24 hours. A failed scan opens or updates the
# issue "Dependency advisories" and fails the run; a clean scan closes it
# (scripts/advisory-issue.sh).

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: advisories
  cancel-in-progress: false

jobs:
  scan:
    name: Scan locked dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      report: ${{ steps.scan.outputs.report }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit@0.22.2

      - name: Scan with cargo audit
        id: scan
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/advisories.txt"
          status=0
          cargo audit --deny warnings >"$report" 2>&1 || status=$?
          cat "$report"
          delimiter="report_$RANDOM$RANDOM"
          { echo "report<<$delimiter"; tail -c 60000 "$report"; echo; echo "$delimiter"; } >>"$GITHUB_OUTPUT"
          exit "$status"

  report:
    name: Open, update, or close the advisory issue
    needs: scan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/advisory-issue.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ needs.scan.outputs.report }}
          RESULT: ${{ needs.scan.result }}
        run: |
          printf '%s\n' "$REPORT" >"$RUNNER_TEMP/advisories.txt"
          bash scripts/advisory-issue.sh "$RESULT" "$RUNNER_TEMP/advisories.txt"
