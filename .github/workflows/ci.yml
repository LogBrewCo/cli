name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --target x86_64-pc-windows-msvc
          rustup default stable

      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-audit@0.22.2

      - name: Check
        run: bash scripts/check-all.sh

      - name: SDK versions match the newest published releases
        run: bash scripts/test-check-sdk-versions.sh

  npm-install:
    name: npm-install (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: npm-install-${{ matrix.target }}

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"

      # npm ci installs the npm release that .github/npm/package-lock.json pins
      # by hash, and later steps run it from that directory.
      - name: Install the latest npm
        run: |
          set -euo pipefail
          npm ci --prefix .github/npm --ignore-scripts --no-audit --no-fund
          node -p 'require("node:path").resolve(".github/npm/node_modules/.bin")' >> "$GITHUB_PATH"

      - name: Check that the lockfile pins the packed npm packages
        run: |
          set -euo pipefail
          [[ "$(npm --version)" == "$(jq -r .dependencies.npm .github/npm/package.json)" ]]
          bash scripts/test-npm-lock-tarballs.sh

      - name: Build the release binary
        run: cargo build --profile dist --locked

      - name: Install the packed npm packages without install scripts
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          expected="logbrew $version"
          binary=target/dist/logbrew
          [[ "$RUNNER_OS" == Windows ]] && binary+=.exe
          bash scripts/npm-packages.sh "$version" target/npm "$TARGET=$binary"
          packages=("$PWD"/target/npm/*.tgz)
          [[ "${#packages[@]}" -eq 2 ]] || exit 1
          for package in "${packages[@]}"; do
            tar -xOzf "$package" package/package.json | jq -e 'has("scripts") | not' >/dev/null
          done
          # npm ci refuses --global, so each project checks the launcher that
          # npm links into node_modules/.bin, the same shim a global install makes.
          root="$PWD"
          for flags in "" --ignore-scripts; do
            project="$(mktemp -d)"
            (
              cd "$project"
              bash "$root/scripts/npm-lock-tarballs.sh" "${packages[@]}"
              npm ci ${flags:+"$flags"} --no-audit --no-fund 2>&1 | tee install.log
              if grep -qi 'install-scripts' install.log; then exit 1; fi
              [[ "$(npx --no -- logbrew --version | tr -d '\r')" == "$expected" ]]
              [[ "$(node_modules/.bin/logbrew --version | tr -d '\r')" == "$expected" ]]
            )
          done
