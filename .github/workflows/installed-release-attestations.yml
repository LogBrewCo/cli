name: Installed release attestations

on:
  push:
    tags:
      - "**[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable release tag
        required: true
        type: string
      source_commit:
        description: Exact released source commit
        required: true
        type: string
      release_run:
        description: Exact successful release workflow run
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  attest:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    name: ${{ matrix.receipt }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - receipt: shell-linux-x64
            runner: ubuntu-24.04
            platform: linux-x64
            mode: shell
            artifact_id: installer:shell
            asset: logbrew-cli-installer.sh
            python: python3
          - receipt: native-linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux-arm64
            mode: native
            artifact_id: native:linux-arm64
            asset: logbrew-cli-aarch64-unknown-linux-gnu.tar.xz
            python: python3
          - receipt: native-linux-x64
            runner: ubuntu-24.04
            platform: linux-x64
            mode: native
            artifact_id: native:linux-x64
            asset: logbrew-cli-x86_64-unknown-linux-gnu.tar.xz
            python: python3
          - receipt: powershell-windows-x64
            runner: windows-2025
            platform: windows-x64
            mode: powershell
            artifact_id: installer:powershell
            asset: logbrew-cli-installer.ps1
            python: python
          - receipt: native-windows-x64
            runner: windows-2025
            platform: windows-x64
            mode: native
            artifact_id: native:windows-x64
            asset: logbrew-cli-x86_64-pc-windows-msvc.zip
            python: python
          - receipt: native-macos-arm64
            runner: macos-15
            platform: macos-arm64
            mode: native
            artifact_id: native:macos-arm64
            asset: logbrew-cli-aarch64-apple-darwin.tar.xz
            python: python3
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          persist-credentials: false

      - name: Resolve matching release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_RUN: ${{ inputs.release_run }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          SOURCE_COMMIT: ${{ inputs.source_commit || github.sha }}
        run: |
          set -euo pipefail
          run_id="$INPUT_RELEASE_RUN"
          for _ in {1..100}; do
            if [[ -z "$run_id" ]]; then
              run_id="$(gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow release.yml \
                --event push \
                --branch "$RELEASE_TAG" \
                --commit "$SOURCE_COMMIT" \
                --limit 1 \
                --json databaseId \
                --jq '.[0].databaseId // empty')"
            fi
            if [[ "$run_id" =~ ^[1-9][0-9]{0,19}$ ]] &&
              gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              printf 'run-id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 0.5
          done
          exit 1

      - name: Execute installed release receipt
        shell: bash
        env:
          ATTESTATION_PYTHON: ${{ matrix.python }}
          GITHUB_TOKEN: ${{ github.token }}
          ATTESTATION_RECEIPT: ${{ matrix.receipt }}
          ATTESTATION_TAG: ${{ inputs.tag || github.ref_name }}
          ATTESTATION_SOURCE_COMMIT: ${{ inputs.source_commit || github.sha }}
          ATTESTATION_RELEASE_RUN: ${{ steps.release.outputs.run-id }}
          ATTESTATION_MODE: ${{ matrix.mode }}
          ATTESTATION_ARTIFACT_ID: ${{ matrix.artifact_id }}
          ATTESTATION_ASSET: ${{ matrix.asset }}
          ATTESTATION_PLATFORM: ${{ matrix.platform }}
          ATTESTATION_RELEASED_SOURCE: ${{ github.workspace }}
          ATTESTATION_OUTPUT: ${{ runner.temp }}/attestation.json
        run: >-
          "$ATTESTATION_PYTHON" scripts/installed_release_attestation.py
          --receipt "$ATTESTATION_RECEIPT"
          --tag "$ATTESTATION_TAG"
          --source-commit "$ATTESTATION_SOURCE_COMMIT"
          --release-run "$ATTESTATION_RELEASE_RUN"
          --mode "$ATTESTATION_MODE"
          --artifact-id "$ATTESTATION_ARTIFACT_ID"
          --asset "$ATTESTATION_ASSET"
          --execution-platform "$ATTESTATION_PLATFORM"
          --released-source "$ATTESTATION_RELEASED_SOURCE"
          --output "$ATTESTATION_OUTPUT"

      - name: Require successful release
        if: ${{ github.event_name == 'push' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN: ${{ steps.release.outputs.run-id }}
        run: |
          set -euo pipefail
          for _ in {1..40}; do
            state="$(gh run view "$RELEASE_RUN" --repo "$GITHUB_REPOSITORY" \
              --json status,conclusion --jq '[.status,.conclusion] | join("|")')"
            [[ "$state" == "completed|success" ]] && exit 0
            [[ "$state" != queued\| && "$state" != in_progress\| ]] && exit 1
            sleep 0.5
          done
          exit 1

      - name: Upload installed attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: installed-attestation-${{ matrix.receipt }}
          path: ${{ runner.temp }}/attestation.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false
          include-hidden-files: false
