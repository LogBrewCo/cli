name: Publish crates.io

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

permissions:
  actions: read
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require exact protected-main artifact prebuild
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          run_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow release.yml \
            --event workflow_dispatch \
            --branch main \
            --commit "$GITHUB_SHA" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"
          [[ "$run_id" =~ ^[0-9]+$ ]] || {
            printf 'No successful exact-main release artifact prebuild exists for %s.\n' "$GITHUB_SHA" >&2
            exit 1
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Check tag matches crate version
        shell: bash
        run: |
          crate_version="$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[] | select(.name == "logbrew-cli").version')"
          tag_version="${GITHUB_REF_NAME#v}"

          if [[ "$crate_version" != "$tag_version" ]]; then
            printf 'Tag %s does not match Cargo.toml version %s.\n' "$GITHUB_REF_NAME" "$crate_version" >&2
            exit 1
          fi

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --no-verify
