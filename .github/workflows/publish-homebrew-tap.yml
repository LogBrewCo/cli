name: Publish Homebrew tap

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
      artifacts_run_id:
        required: true
        type: string
      release_tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing public release tag to recover
        required: true
        type: string
      artifacts_run_id:
        description: Successful exact-commit prebuild run
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PLAN: ${{ inputs.plan }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      ARTIFACTS_RUN_ID: ${{ inputs.artifacts_run_id }}
      GITHUB_USER: "LogBrew release bot"
      GITHUB_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: release-tooling

      - name: Checkout tap
        uses: actions/checkout@v7
        with:
          persist-credentials: true
          path: tap
          repository: "LogBrewCo/homebrew-tap"
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Fetch Homebrew formulae
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifacts_run_id }}
          pattern: artifacts-build-global
          path: tap/Formula/
          merge-multiple: true

      - name: Require exact public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash release-tooling/scripts/validate-publish-boundary.sh

      - name: Validate and commit formula files
        shell: bash
        run: |
          set -euo pipefail
          cd tap

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ -f Formula/logbrew.rb ]] || exit 1
            PLAN="$(jq -cn --arg version "$EXPECTED_VERSION" '{releases:[{app_version:$version,artifacts:["logbrew.rb"]}]}')"
          fi

          git config --local user.name "${GITHUB_USER}"
          git config --local user.email "${GITHUB_EMAIL}"

          export PATH="/home/linuxbrew/.linuxbrew/bin:${PATH}"
          command -v brew >/dev/null

          audit_tap="logbrew-release-verifier/formula"
          audit_parent="$(brew --repository)/Library/Taps/logbrew-release-verifier"
          audit_repo="${audit_parent}/homebrew-formula"
          [[ ! -e "${audit_repo}" && ! -L "${audit_repo}" ]] || exit 1
          mkdir -p "${audit_parent}"
          ln -s "${GITHUB_WORKSPACE}/tap" "${audit_repo}"
          cleanup_audit_tap() {
            if [[ -L "${audit_repo}" && "$(readlink "${audit_repo}")" == "${GITHUB_WORKSPACE}/tap" ]]; then
              unlink "${audit_repo}"
              rmdir "${audit_parent}" 2>/dev/null || true
            fi
          }
          trap cleanup_audit_tap EXIT

          release_count=0
          while IFS= read -r release; do
            release_count=$((release_count + 1))
            filename="$(jq -r '.artifacts[] | select(endswith(".rb"))' <<<"${release}")"
            version="$(jq -r '.app_version' <<<"${release}")"

            if [[ ! "${filename}" =~ ^[a-z0-9][a-z0-9._+-]*\.rb$ ]]; then
              printf 'Homebrew formula validation failed: invalid filename.\n' >&2
              exit 1
            fi
            if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              printf 'Homebrew formula validation failed: invalid version.\n' >&2
              exit 1
            fi

            name="${filename%.rb}"
            ruby ../release-tooling/scripts/prepare-homebrew-formula.rb \
              "Formula/${filename}" "${version}"
            brew audit --fix --strict --online --formula "${audit_tap}/${name}"
            ruby -c "Formula/${filename}"

            git add "Formula/${filename}"
            if git diff --cached --quiet -- "Formula/${filename}"; then
              printf 'Formula already up to date.\n'
            else
              git commit -m "${name} ${version}"
            fi
          done < <(
            jq -c \
              '.releases[] | select([.artifacts[] | endswith(".rb")] | any)' \
              <<<"${PLAN}"
          )

          if [[ "${release_count}" -eq 0 ]]; then
            printf 'Homebrew formula validation failed: no formula release.\n' >&2
            exit 1
          fi

          cleanup_audit_tap
          if [[ -e "${audit_repo}" || -L "${audit_repo}" ]]; then
            printf 'Homebrew formula validation failed: temporary tap remains.\n' >&2
            exit 1
          fi
          trap - EXIT

          git push
