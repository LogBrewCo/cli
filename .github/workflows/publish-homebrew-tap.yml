name: Publish Homebrew tap

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
      artifacts_run_id:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing public release tag to recover
        required: true
        type: string
      artifacts_run_id:
        description: Successful exact-commit prebuild run
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PLAN: ${{ inputs.plan }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      ARTIFACTS_RUN_ID: ${{ inputs.artifacts_run_id }}
      GITHUB_USER: "LogBrew release bot"
      GITHUB_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
    steps:
      - name: Validate manual recovery boundary
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          target="$(gh release view "$RELEASE_TAG" --json targetCommitish,isDraft,isPrerelease --jq 'select(.isDraft == false and .isPrerelease == false) | .targetCommitish')"
          run="$(gh run view "$ARTIFACTS_RUN_ID" --json name,event,headBranch,headSha,conclusion)"
          [[ "$target" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$(jq -r '.name' <<<"$run")" == "Release" ]] || exit 1
          [[ "$(jq -r '.event' <<<"$run")" == "workflow_dispatch" ]] || exit 1
          [[ "$(jq -r '.headBranch' <<<"$run")" == "main" ]] || exit 1
          [[ "$(jq -r '.headSha' <<<"$run")" == "$target" ]] || exit 1
          [[ "$(jq -r '.conclusion' <<<"$run")" == "success" ]] || exit 1
          printf 'EXPECTED_VERSION=%s\n' "${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - name: Checkout release tooling
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: release-tooling

      - name: Checkout tap
        uses: actions/checkout@v7
        with:
          persist-credentials: true
          path: tap
          repository: "LogBrewCo/homebrew-tap"
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Fetch Homebrew formulae
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifacts_run_id }}
          pattern: artifacts-build-global
          path: tap/Formula/
          merge-multiple: true

      - name: Validate and commit formula files
        shell: bash
        run: |
          set -euo pipefail
          cd tap

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ -f Formula/logbrew.rb ]] || exit 1
            PLAN="$(jq -cn --arg version "$EXPECTED_VERSION" '{releases:[{app_version:$version,artifacts:["logbrew.rb"]}]}')"
          fi

          git config --local user.name "${GITHUB_USER}"
          git config --local user.email "${GITHUB_EMAIL}"

          export PATH="/home/linuxbrew/.linuxbrew/bin:${PATH}"
          command -v brew >/dev/null

          audit_tap="logbrew-release-verifier/formula"
          if brew tap | grep -Fxq "${audit_tap}"; then
            printf 'Homebrew formula validation failed: temporary tap already exists.\n' >&2
            exit 1
          fi
          brew tap-new --no-git "${audit_tap}" >/dev/null
          audit_repo="$(brew --repository "${audit_tap}")"
          cleanup_audit_tap() {
            brew untap "${audit_tap}" >/dev/null 2>&1 || true
          }
          trap cleanup_audit_tap EXIT

          release_count=0
          while IFS= read -r release; do
            release_count=$((release_count + 1))
            filename="$(jq -r '.artifacts[] | select(endswith(".rb"))' <<<"${release}")"
            version="$(jq -r '.app_version' <<<"${release}")"

            if [[ ! "${filename}" =~ ^[a-z0-9][a-z0-9._+-]*\.rb$ ]]; then
              printf 'Homebrew formula validation failed: invalid filename.\n' >&2
              exit 1
            fi
            if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              printf 'Homebrew formula validation failed: invalid version.\n' >&2
              exit 1
            fi

            name="${filename%.rb}"
            ruby ../release-tooling/scripts/prepare-homebrew-formula.rb \
              "Formula/${filename}" "${version}"
            brew style --fix "Formula/${filename}"
            ruby -c "Formula/${filename}"
            brew style "Formula/${filename}"

            cp "Formula/${filename}" "${audit_repo}/Formula/${filename}"
            brew audit --strict --online --formula "${audit_tap}/${name}"

            git add "Formula/${filename}"
            if git diff --cached --quiet -- "Formula/${filename}"; then
              printf 'Formula already up to date.\n'
            else
              git commit -m "${name} ${version}"
            fi
          done < <(
            jq -c \
              '.releases[] | select([.artifacts[] | endswith(".rb")] | any)' \
              <<<"${PLAN}"
          )

          if [[ "${release_count}" -eq 0 ]]; then
            printf 'Homebrew formula validation failed: no formula release.\n' >&2
            exit 1
          fi

          cleanup_audit_tap
          if brew tap | grep -Fxq "${audit_tap}"; then
            printf 'Homebrew formula validation failed: temporary tap remains.\n' >&2
            exit 1
          fi
          trap - EXIT

          git push
