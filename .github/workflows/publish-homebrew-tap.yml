name: Publish Homebrew tap

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
      artifacts_run_id:
        required: true
        type: string
      release_tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing public release tag to recover
        required: true
        type: string
      artifacts_run_id:
        description: Successful exact-commit prebuild run
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PLAN: ${{ inputs.plan }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      ARTIFACTS_RUN_ID: ${{ inputs.artifacts_run_id }}
      GITHUB_USER: "LogBrew release bot"
      GITHUB_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: release-tooling

      - name: Checkout tap
        uses: actions/checkout@v7
        with:
          persist-credentials: true
          path: tap
          repository: "LogBrewCo/homebrew-tap"
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Fetch Homebrew formulae
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifacts_run_id }}
          pattern: artifacts-build-global
          path: tap/Formula/
          merge-multiple: true

      - name: Validate and commit formula files
        shell: bash
        run: |
          set -euo pipefail
          cd tap
          expected_version="${RELEASE_TAG#v}"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ -f Formula/logbrew.rb ]] || exit 1
            PLAN="$(jq -cn --arg version "$expected_version" '{releases:[{app_version:$version,artifacts:["logbrew.rb"]}]}')"
          fi

          jq -e --arg version "$expected_version" '
            [.releases[] | select([.artifacts[] | endswith(".rb")] | any)] as $formulae
            | ($formulae | length == 1)
              and ($formulae[0].app_version == $version)
              and ([$formulae[0].artifacts[] | select(endswith(".rb"))] == ["logbrew.rb"])
          ' <<<"$PLAN" >/dev/null || exit 1
          mapfile -t formulae < <(find Formula -maxdepth 1 -name '*.rb' -print)
          [[ "${#formulae[@]}" -eq 1 && "${formulae[0]}" == "Formula/logbrew.rb" && ! -L "${formulae[0]}" ]] || exit 1

          git config --local user.name "${GITHUB_USER}"
          git config --local user.email "${GITHUB_EMAIL}"
          git add Formula/logbrew.rb
          if git diff --cached --quiet -- Formula/logbrew.rb; then
            printf 'Formula already up to date.\n'
          else
            git commit -m "logbrew ${expected_version}"
          fi

          GH_TOKEN="${{ github.token }}" bash ../release-tooling/scripts/validate-publish-boundary.sh
          git push
