name: Publish npm (trusted)

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
      release_tag:
        type: string
      artifacts_run_id:
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PLAN: ${{ inputs.plan }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      ARTIFACTS_RUN_ID: ${{ inputs.artifacts_run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: release-tooling
      - name: Fetch exact-main npm package
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifacts_run_id }}
          pattern: artifacts-build-global
          path: npm/
          merge-multiple: true

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          registry-url: "https://registry.npmjs.org"

      - name: Require exact public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash release-tooling/scripts/validate-publish-boundary.sh

      - name: Publish npm packages with OIDC
        shell: bash
        run: |
          npm --version | awk -F. '$1 > 11 || ($1 == 11 && $2 >= 5) { found=1 } END { exit !found }'
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            packages=(npm/*-npm-package.tar.gz)
            [[ "${#packages[@]}" -eq 1 ]] || exit 1
            manifest="$(tar -xOf "${packages[0]}" package/package.json)"
            [[ "$(jq -r '.name' <<<"$manifest")" == "logbrew-cli" ]] || exit 1
            [[ "$(jq -r '.version' <<<"$manifest")" == "$EXPECTED_VERSION" ]] || exit 1
            npm publish --access public "./${packages[0]}"
            exit
          fi
          while IFS= read -r release; do
            pkg="$(jq -r '.artifacts[] | select(endswith("-npm-package.tar.gz"))' <<<"$release")"
            [[ "$pkg" =~ ^[a-z0-9][a-z0-9._+-]*-npm-package\.tar\.gz$ ]] || exit 1
            npm publish --access public "./npm/${pkg}"
          done < <(jq -c '.releases[] | select([.artifacts[] | endswith("-npm-package.tar.gz")] | any)' <<<"$PLAN")
