name: Publish npm (trusted)

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
      release_tag:
        type: string
      artifacts_run_id:
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      ARTIFACTS_RUN_ID: ${{ inputs.artifacts_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: release-tooling
      - name: Fetch exact-main npm packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.artifacts_run_id }}
          name: npm-packages
          path: npm/

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
          registry-url: "https://registry.npmjs.org"

      - name: Require exact public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash release-tooling/scripts/validate-publish-boundary.sh

      - name: Publish npm packages with OIDC
        shell: bash
        run: |
          set -euo pipefail
          npm --version | awk -F. '$1 > 11 || ($1 == 11 && $2 >= 5) { found=1 } END { exit !found }'
          # Platform packages go first so logbrew-cli never points at a missing binary.
          # A rerun skips a version that npm already holds with the same bytes.
          for name in @logbrew/cli-darwin-arm64 @logbrew/cli-darwin-x64 @logbrew/cli-linux-arm64 @logbrew/cli-linux-x64 @logbrew/cli-win32-x64 logbrew-cli; do
            tarball="npm/$(sed 's|^@||; s|/|-|' <<<"$name")-${EXPECTED_VERSION}.tgz"
            tar -xOzf "$tarball" package/package.json |
              jq -e --arg name "$name" --arg version "$EXPECTED_VERSION" '.name == $name and .version == $version and (has("scripts") | not)' >/dev/null
            integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w0)"
            published="$(npm view "${name}@${EXPECTED_VERSION}" dist.integrity 2>/dev/null || true)"
            if [[ -n "$published" ]]; then
              [[ "$published" == "$integrity" ]] || exit 1
              continue
            fi
            npm publish --access public "./$tarball"
          done
