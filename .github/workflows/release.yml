name: Release

permissions:
  actions: read
  contents: write

on:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        type: string
      artifacts_run_id:
        type: string
  push:
    tags:
      - "**[0-9]+.[0-9]+.[0-9]+*"

jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ github.event_name == 'push' && github.ref_name || '' }}
      tag-flag: ${{ github.event_name == 'push' && format('--tag={0}', github.ref_name) || '' }}
      publishing: ${{ github.event_name == 'push' }}
      prebuild-run-id: ${{ steps.prebuild.outputs.run-id }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Require protected main for artifact prebuilds
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag == '' }}
        shell: bash
        run: |
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            printf 'Release artifact prebuilds must run from protected main.\n' >&2
            exit 1
          }
      - name: Find the exact protected-main prebuild
        id: prebuild
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          run_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow release.yml \
            --event workflow_dispatch \
            --branch main \
            --commit "$GITHUB_SHA" \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"
          [[ "$run_id" =~ ^[0-9]+$ ]] || {
            printf 'No successful exact-main release artifact prebuild exists for %s.\n' "$GITHUB_SHA" >&2
            exit 1
          }
          printf 'run-id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"
      - name: Install dist
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh
      - uses: actions/upload-artifact@v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      - id: plan
        shell: bash
        run: |
          dist ${{ github.event_name == 'push' && format('host --steps=create --tag={0}', github.ref_name) || 'plan' }} --output-format=json > plan-dist-manifest.json
          echo "manifest=$(jq -c '.' plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  build-local-artifacts:
    name: build-local-artifacts (${{ matrix.target }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag == '' && github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
            install_dist: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            install_dist: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            install_dist: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            install_dist: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            install_dist: irm https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.ps1 | iex
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ matrix.target }}-dist-manifest.json
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: swatinem/rust-cache@v2
        with:
          key: workspace-v1-${{ matrix.target }}
          cache-workspace-crates: true
      - name: Install dist
        run: ${{ matrix.install_dist }}
      - name: Build artifacts
        run: dist build --artifacts=local --target=${{ matrix.target }} --output-format=json > dist-manifest.json
      - id: cargo-dist
        shell: bash
        run: |
          {
            echo "paths<<EOF"
            dist print-upload-files-from-manifest --manifest dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-local-${{ matrix.target }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  build-global-artifacts:
    needs: build-local-artifacts
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag == '' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install dist
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh
      - uses: actions/download-artifact@v8
        with:
          pattern: artifacts-build-local-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build --output-format=json --artifacts=global > dist-manifest.json
          {
            echo "paths<<EOF"
            jq --raw-output '.upload_files[]' dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  host:
    needs: plan
    if: ${{ needs.plan.outputs.publishing == 'true' && needs.plan.outputs.prebuild-run-id != '' }}
    runs-on: ubuntu-22.04
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      - name: Fetch release plan
        uses: actions/download-artifact@v8
        with:
          name: artifacts-plan-dist-manifest
          path: target/distrib/
      - name: Fetch exact-main prebuilt artifacts
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.plan.outputs.prebuild-run-id }}
          pattern: artifacts-build-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        run: |
          dist host ${{ needs.plan.outputs.tag-flag }} --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "manifest=$(jq -c '.' dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: artifacts-dist-manifest
          path: dist-manifest.json
      - name: Create GitHub Release
        env:
          ANNOUNCEMENT_IS_PRERELEASE: ${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease }}
          ANNOUNCEMENT_TITLE: ${{ fromJson(steps.host.outputs.manifest).announcement_title }}
          ANNOUNCEMENT_BODY: ${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}
        shell: bash
        run: |
          find target/distrib -maxdepth 1 -type f -name '*-dist-manifest.json' -delete
          printf '%s\n' "$ANNOUNCEMENT_BODY" > "$RUNNER_TEMP/notes.txt"
          release_args=()
          [[ "$ANNOUNCEMENT_IS_PRERELEASE" == "true" ]] && release_args+=(--prerelease)
          gh release create "${{ needs.plan.outputs.tag }}" --target "$GITHUB_SHA" "${release_args[@]}" --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" target/distrib/*

  custom-publish-npm-trusted:
    needs:
      - plan
      - host
    if: ${{ always() && needs.plan.result == 'success' && ((needs.host.result == 'success' && (!fromJson(needs.plan.outputs.val).announcement_is_prerelease || fromJson(needs.plan.outputs.val).publish_prereleases)) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && inputs.artifacts_run_id != '')) }}
    uses: ./.github/workflows/publish-npm-trusted.yml
    with:
      plan: ${{ needs.plan.outputs.val }}
      release_tag: ${{ inputs.release_tag }}
      artifacts_run_id: ${{ inputs.artifacts_run_id || needs.plan.outputs.prebuild-run-id }}
    secrets: inherit
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: write

  custom-publish-homebrew-tap:
    needs:
      - plan
      - host
    if: ${{ always() && needs.plan.result == 'success' && needs.host.result == 'success' && (!fromJson(needs.plan.outputs.val).announcement_is_prerelease || fromJson(needs.plan.outputs.val).publish_prereleases) }}
    uses: ./.github/workflows/publish-homebrew-tap.yml
    with:
      plan: ${{ needs.plan.outputs.val }}
      artifacts_run_id: ${{ needs.plan.outputs.prebuild-run-id }}
    secrets: inherit
    permissions:
      actions: read
      contents: read
