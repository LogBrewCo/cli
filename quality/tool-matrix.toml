# Tool matrix: every gate, guard, and quality tool this repository runs, with its
# version, checksum, rules, conflicts, exceptions, runtime, findings, and the date
# its releases, advisories, and rules were last checked. scripts/check-tool-matrix.sh
# enforces it (see its header); scripts/check-all.sh runs that check.
#
# Runtimes come from GitHub Actions step timings since 2026-09-19. Every run starts
# from a fresh runner (the npm-install jobs restore a Cargo cache). p99 needs 100
# runs; below that an entry gives the run count and the maximum.
# Format: one `key = value` per line, arrays on one line, pins as "file::text"
# where @VERSION@ stands for the entry's version. `uses` lists actions by name; the
# workflows hold each pin (a full commit and a version comment).

gates = ["scripts/check-all.sh"]
utilities = ["[[", "awk", "basename", "bash", "cat", "cd", "cmp", "command", "continue", "cp", "curl", "cut", "dirname", "echo", "exit", "export", "find", "gh", "git", "grep", "jq", "mapfile", "mkdir", "mktemp", "openssl", "printf", "rmdir", "sed", "set", "sh", "sleep", "sudo", "tail", "tar", "tee", "tr", "trap", "true", "uname", "unzip", "wait", "xargs"]

[[tool]]
id = "rust"
risk = "Rust compile errors, compiler lints (warnings deny), and test failures"
tool = "rustc, cargo, and libtest"
version = "stable"
unpinned = "CI installs the latest stable toolchain on every run (dtolnay/rust-toolchain, toolchain: stable); Cargo.toml requires at least 1.87"
uses = ["dtolnay/rust-toolchain", "swatinem/rust-cache"]
commands = ["cargo test", "cargo build", "cargo metadata", "cargo package", "rustc"]
runs_in = "CI check job (scripts/check-all.sh), npm-install jobs, release builds"
config = "Cargo.toml [lints]"
conflicts = "a floating toolchain can change results without a commit; pinning it is an open question"
exceptions = "none"
runtime = "check step: push n=38, max 73 s; pull request n=50, max 107 s; p99 unsupported"
findings = "unknown: failures are fixed before merge and not recorded"
replaces = "none"
checked = 2026-10-19

[[tool]]
id = "clippy"
risk = "Rust correctness, suspicious, complexity, performance, and style lints"
tool = "Clippy (through clippy-driver as the workspace wrapper)"
version = "stable"
unpinned = "ships with the stable toolchain (see rust)"
commands = ["clippy-driver"]
runs_in = "CI check job: scripts/check-all.sh compiles every target once with clippy-driver"
config = "Cargo.toml [lints]; every warning fails"
conflicts = "none known"
exceptions = "none"
runtime = "inside the check step (see rust)"
findings = "lints are fixed before merge; until 2026-10-23 test targets skipped clippy, and a seeded vec.get(0) in a test now fails the gate"
replaces = "a separate cargo clippy build"
checked = 2026-10-23

[[tool]]
id = "rustfmt"
risk = "Rust formatting drift"
tool = "rustfmt"
version = "stable"
unpinned = "ships with the stable toolchain (see rust)"
commands = ["cargo fmt"]
runs_in = "CI check job (scripts/check-all.sh)"
config = "defaults; cargo fmt --all -- --check"
conflicts = "none known"
exceptions = "none"
runtime = "inside the check step (see rust)"
findings = "unknown: formatting is fixed before merge"
replaces = "none"
checked = 2026-10-19

[[tool]]
id = "cargo-audit"
risk = "dependency advisories, including ones published after the change that locked a dependency merged"
tool = "cargo-audit, and scripts/advisory-issue.sh for the daily scan"
version = "0.22.2"
pins = ["scripts/cargo-audit-version.sh::LOGBREW_CARGO_AUDIT_VERSION:-@VERSION@}", ".github/workflows/ci.yml::tool: cargo-audit@@VERSION@", ".github/workflows/advisories.yml::tool: cargo-audit@@VERSION@"]
uses = ["taiki-e/install-action"]
commands = ["cargo audit", "scripts/advisory-issue.sh"]
runs_in = "CI check job (scripts/check-all.sh); release preflight; Advisories workflow every day at 05:17 UTC and on manual runs (opens, updates, or closes the issue \"Dependency advisories\")"
config = ".cargo/audit.toml; the daily scan adds --deny warnings, so unsound, unmaintained, and yanked warnings fail it"
conflicts = "none known"
exceptions = "RUSTSEC-2026-0381 (webpki-roots 0.26.11 re-exports 1.x; .cargo/audit.toml)"
runtime = "inside the check step; installing it takes at most 4 s (n=50)"
findings = "first daily-scan run 2026-10-25: RUSTSEC-2026-0386 (tokio 1.53.2, unsound), a warning the check job allows"
replaces = "none"
checked = 2026-10-25

[[tool]]
id = "cargo-dist"
risk = "release archives, installers, and checksums built differently from the plan"
tool = "cargo-dist"
version = "0.32.0"
pins = ["dist-workspace.toml::cargo-dist-version = \"@VERSION@\""]
commands = ["dist"]
runs_in = "Release workflow"
config = "dist-workspace.toml"
conflicts = "none known"
exceptions = "none"
runtime = "release jobs; see the Release workflow runs"
findings = "unknown: no recorded finding"
replaces = "none"
status = "behind: 0.33.0 released"
checked = 2026-10-19

[[tool]]
id = "homebrew-formula-audit"
risk = "a Homebrew formula that brew audit rejects"
tool = "Ruby formula preparation and brew audit --strict"
version = "runner"
unpinned = "the runner image's Ruby and Homebrew"
commands = ["ruby", "brew"]
runs_in = "CI check job (formula preparation test); Release workflow (audit before publishing the formula)"
config = "scripts/prepare-homebrew-formula.rb"
conflicts = "none known"
exceptions = "the first audit pass may fix the formula; the second must pass"
runtime = "release jobs; see the Release workflow runs"
findings = "unknown: no recorded finding"
replaces = "none"
checked = 2026-10-19

[[tool]]
id = "npm-packaging"
risk = "npm packages that run install scripts or install the wrong binary"
tool = "Node.js and npm (packaging tests and trusted publishing, not quality tools)"
version = "24.19.0"
pins = [".github/workflows/ci.yml::node-version: \"@VERSION@\"", ".github/workflows/ci.yml::npm install --global npm@12.2.0", ".github/workflows/publish-npm-trusted.yml::node-version: \"@VERSION@\""]
uses = ["actions/setup-node"]
commands = ["npm", "npm init", "npm install", "npm publish", "npm view", "npx"]
runs_in = "CI npm-install jobs on Linux, macOS, and Windows; npm trusted publishing"
config = "scripts/npm-packages.sh"
conflicts = "npm here installs and publishes the release; it does not check code"
exceptions = "none"
runtime = "install step: Linux arm64 max 8 s, macOS max 8 s (n=45 each); npm self-update once took 246 s on macOS"
findings = "unknown: no recorded finding"
replaces = "none"
checked = 2026-10-19

[[tool]]
id = "repository-tests"
risk = "regressions in the gate, release preflight, installer attestation, public install smoke, SDK version, and npm packaging scripts; a release installer that installs the wrong version"
tool = "repository test scripts"
version = "repository"
unpinned = "repository scripts, versioned by commit"
commands = ["scripts/check-all.sh", "scripts/test-check-all.sh", "scripts/test-check-sdk-versions.sh", "scripts/cargo-audit-version.sh", "scripts/test-release-preflight.sh", "scripts/test-installed-release-attestation.py", "scripts/test-installed-release-attestation-workflow.py", "scripts/test-real-user-public-install-smoke.py", "scripts/npm-packages.sh", "release-tooling/scripts/validate-publish-boundary.sh", "cargo-home/bin/logbrew"]
runs_in = "CI check job; release and publish workflows"
config = "each script"
conflicts = "none known"
exceptions = "none"
runtime = "SDK versions step: push n=5, max 5 s; pull request n=6, max 3 s"
findings = "unknown: no recorded finding"
replaces = "none"
checked = 2026-10-19

[[tool]]
id = "public-guard"
risk = "secrets or non-public text in commits, paths, branch names, and pull request text"
tool = "gitleaks with the public guard rules"
version = "8.30.1"
pins = ["scripts/public-guard.sh::readonly gitleaks_version=\"@VERSION@\"", "scripts/public-guard.sh::e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080", "scripts/public-guard.sh::551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"]
commands = ["scripts/public-guard.sh", "scripts/test-public-guard.sh"]
runs_in = "Public guard workflow (required status) on every pull request and push"
config = "scripts/public-guard.toml"
conflicts = "none known"
exceptions = "false positives are fixed in their own pull request"
runtime = "see the Public guard workflow runs"
findings = "unknown: findings are fixed before merge"
replaces = "none"
checked = 2026-10-19

[[tool]]
id = "release-actions"
risk = "release artifact, attestation, and publishing supply chain"
tool = "GitHub actions used by the release and publish workflows"
version = "pinned in the workflows"
unpinned = "each workflow pins the commit with a version comment; the check requires one such pin per action"
uses = ["actions/attest-build-provenance", "actions/download-artifact", "actions/upload-artifact", "rust-lang/crates-io-auth-action", "./.github/workflows/publish-npm-trusted.yml", "./.github/workflows/publish-homebrew-tap.yml", "actions/checkout"]
commands = ["cargo publish"]
runs_in = "every workflow (checkout); release and publish workflows"
config = "release.yml, publish-*.yml"
conflicts = "none known"
exceptions = "none"
runtime = "release jobs; see the Release workflow runs"
findings = "not a check; supply-chain pins"
replaces = "none"
checked = 2026-10-19

[[tool]]
id = "tool-matrix"
risk = "a gate tool without an entry, a pin that differs from its entry, an entry not checked for 30 days"
tool = "scripts/check-tool-matrix.sh and its seeded tests"
version = "repository"
unpinned = "repository script, versioned by commit"
commands = ["scripts/check-tool-matrix.sh", "scripts/test-check-tool-matrix.sh"]
runs_in = "CI check job (scripts/check-all.sh)"
config = "this file"
conflicts = "reads commands with a small shell reader; a command built at run time is invisible to it"
exceptions = "none"
runtime = "new; record from CI runs at the next check"
findings = "seeded: an unlisted command, a changed pin, a changed action commit, a stale or future date, and a missing field each fail"
replaces = "none"
checked = 2026-10-19
