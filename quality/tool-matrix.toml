# Tool matrix: every gate, guard, and quality tool this repository runs, with its
# version, checksum, rules, conflicts, exceptions, runtime, findings, and the date
# its releases, advisories, and rules were last checked. scripts/check-tool-matrix.sh
# enforces it (see its header); scripts/check-all.sh runs that check.
#
# Runtimes come from GitHub Actions step timings since 2026-09-19. Every run starts
# from a fresh runner (the npm-install jobs restore a Cargo cache). p99 needs 100
# runs; below that an entry gives the run count and the maximum.
# Format: one `key = value` per line, arrays on one line, pins as "file::text"
# where @VERSION@ stands for the entry's version. `uses` lists actions by name; the
# workflows hold each pin (a full commit and a version comment).

gates = ["scripts/check-all.sh"]
utilities = ["[[", "awk", "basename", "bash", "cat", "cd", "cmp", "command", "continue", "cp", "curl", "cut", "dirname", "echo", "exit", "export", "find", "gh", "git", "grep", "jq", "mapfile", "mkdir", "mktemp", "openssl", "printf", "rmdir", "sed", "set", "sh", "sleep", "sudo", "tail", "tar", "tee", "tr", "trap", "true", "uname", "unzip", "wait", "xargs"]

[[tool]]
id = "rust"
risk = "Rust compile errors, compiler lints (warnings deny), and test failures"
tool = "rustc, cargo, and libtest"
version = "stable"
unpinned = "CI installs the latest stable toolchain on every run (rustup toolchain install stable); Cargo.toml requires at least 1.87"
uses = ["swatinem/rust-cache"]
commands = ["cargo test", "cargo build", "cargo metadata", "cargo package", "rustc", "rustup"]
runs_in = "CI check job (scripts/check-all.sh), npm-install jobs, release builds"
config = "Cargo.toml [lints]"
conflicts = "a floating toolchain can change results without a commit; pinning it is an open question"
exceptions = "none"
runtime = "check step: push n=38, max 73 s; pull request n=50, max 107 s; p99 unsupported"
findings = "unknown: failures are fixed before merge and not recorded; recheck 2026-11-19: stable is 1.100.0, and main CI passed with it"
replaces = "none"
checked = 2026-11-19

[[tool]]
id = "clippy"
risk = "Rust correctness, suspicious, complexity, performance, and style lints"
tool = "Clippy (through clippy-driver as the workspace wrapper)"
version = "stable"
unpinned = "ships with the stable toolchain (see rust)"
commands = ["clippy-driver"]
runs_in = "CI check job: scripts/check-all.sh compiles every target once with clippy-driver"
config = "Cargo.toml [lints]; every warning fails"
conflicts = "the nursery lint redundant_pub_crate asks for the opposite of rustc's unreachable_pub on items shared by private sibling modules (rust-clippy#5369)"
exceptions = "redundant_pub_crate is allowed in Cargo.toml [lints] because of that conflict; no inline suppressions"
runtime = "inside the check step (see rust)"
findings = "lints are fixed before merge; until 2026-10-23 test targets skipped clippy, and a seeded vec.get(0) in a test now fails the gate; recheck 2026-11-23: stable 1.100.0 ships the current Clippy, main CI passed with it, and rust-clippy#5369 is still open, so the redundant_pub_crate allow stays"
replaces = "a separate cargo clippy build"
checked = 2026-11-23

[[tool]]
id = "rustfmt"
risk = "Rust formatting drift"
tool = "rustfmt"
version = "stable"
unpinned = "ships with the stable toolchain (see rust)"
commands = ["cargo fmt"]
runs_in = "CI check job (scripts/check-all.sh)"
config = "defaults; cargo fmt --all -- --check"
conflicts = "none known"
exceptions = "none"
runtime = "inside the check step (see rust)"
findings = "unknown: formatting is fixed before merge"
replaces = "none"
checked = 2026-11-19

[[tool]]
id = "cargo-audit"
risk = "dependency advisories, including ones published after the change that locked a dependency merged"
tool = "cargo-audit, and scripts/advisory-issue.sh for the daily scan"
version = "0.23.0"
pins = ["scripts/cargo-audit-version.sh::LOGBREW_CARGO_AUDIT_VERSION:-@VERSION@}", ".github/workflows/ci.yml::tool: cargo-audit@@VERSION@", ".github/workflows/advisories.yml::tool: cargo-audit@@VERSION@"]
uses = ["taiki-e/install-action"]
commands = ["cargo audit", "scripts/advisory-issue.sh"]
runs_in = "CI check job (scripts/check-all.sh); release preflight; Advisories workflow every day at 05:17 UTC and on manual runs (opens, updates, or closes the issue \"Dependency advisories\")"
config = ".cargo/audit.toml; the daily scan adds --deny warnings, so unsound, unmaintained, and yanked warnings fail it"
conflicts = "none known"
exceptions = "RUSTSEC-2026-0381 (webpki-roots 0.26.11 re-exports 1.x; .cargo/audit.toml)"
runtime = "inside the check step; installing it takes at most 4 s (n=50)"
findings = "seeded 2026-10-25: a throwaway branch pinning base64 0.5.1 failed with RUSTSEC-2017-0004 and opened issue #392 (run 40185022571; branch deleted); local run on main 2026-10-25: RUSTSEC-2026-0386 (tokio 1.53.2, unsound), a warning the check job allows; 2026-11-25: cargo-audit 0.23.0 (rustsec 0.34) on main: 0 vulnerabilities, and 0 warnings with --deny warnings; RUSTSEC-2026-0381 stays because tokio-tungstenite 0.30.0, the newest release, still requires webpki-roots ^0.26"
replaces = "none"
checked = 2026-11-25

[[tool]]
id = "cargo-dist"
risk = "release archives, installers, and checksums built differently from the plan"
tool = "cargo-dist"
version = "0.34.0"
pins = ["dist-workspace.toml::cargo-dist-version = \"@VERSION@\"", "scripts/install-dist.sh::version=@VERSION@"]
commands = ["dist", "scripts/install-dist.sh", "scripts/test-install-dist.sh"]
runs_in = "Release workflow"
config = "dist-workspace.toml"
conflicts = "release.yml is maintained in this repository (allow-dirty = [\"ci\"]), so dist generate refuses to rewrite it; an upgrade ports the generator's own diff by hand. 0.34.0 also emits the self-repository syntax ($/) for local reusable workflows; release.yml keeps ./ for now"
exceptions = "none"
runtime = "release jobs; see the Release workflow runs"
findings = "recheck 2026-11-19: dist plan lists the same 18 artifacts with 0.32.0 and 0.34.0, and 0.34.0 now picks macos-15 for aarch64-apple-darwin, matching the runner release.yml already pins; no published advisories. 2026-11-23: the release jobs ran the 0.34.0 installer script through curl | sh; scripts/install-dist.sh now installs the release archive only when its sha256 matches the pinned hash, and scripts/test-install-dist.sh proves that it refuses another archive"
replaces = "none"
checked = 2026-11-23

[[tool]]
id = "homebrew-formula-audit"
risk = "a Homebrew formula that brew audit rejects"
tool = "Ruby formula preparation and brew audit --strict"
version = "runner"
unpinned = "the runner image's Ruby and Homebrew"
commands = ["ruby", "brew"]
runs_in = "CI check job (formula preparation test); Release workflow (audit before publishing the formula)"
config = "scripts/prepare-homebrew-formula.rb"
conflicts = "none known"
exceptions = "the first audit pass may fix the formula; the second must pass"
runtime = "release jobs; see the Release workflow runs"
findings = "unknown: no recorded finding"
replaces = "none"
checked = 2026-11-19

[[tool]]
id = "npm-packaging"
risk = "npm packages that run install scripts or install the wrong binary"
tool = "Node.js and npm (packaging tests and trusted publishing, not quality tools)"
version = "24.22.3"
pins = [".github/workflows/ci.yml::node-version: \"@VERSION@\"", ".github/npm/package.json::\"npm\": \"12.2.3\"", ".github/workflows/publish-npm-trusted.yml::node-version: \"@VERSION@\""]
uses = ["actions/setup-node"]
commands = ["npm", "npm ci", "npm publish", "npm view", "npx", "node", "scripts/npm-lock-tarballs.sh", "scripts/test-npm-lock-tarballs.sh", "node_modules/.bin/logbrew"]
runs_in = "CI npm-install jobs on Linux, macOS, and Windows; npm trusted publishing"
config = "scripts/npm-packages.sh"
conflicts = "npm here installs and publishes the release; it does not check code"
exceptions = "none"
runtime = "install step: Linux arm64 max 8 s, macOS max 8 s (n=45 each); npm self-update once took 246 s on macOS"
findings = "recheck 2026-11-19: 24.19.0 missed the Node.js security releases 24.22.1 and 24.22.3; moved to 24.22.3 and npm 12.2.3. 2026-11-23: the npm-install jobs ran 3 npm install commands that no lockfile pinned; npm ci now installs npm from .github/npm/package-lock.json and the packed packages from a lockfile that pins their sha512 (scripts/test-npm-lock-tarballs.sh proves npm ci refuses other bytes). npm ci refuses --global, so the job runs the node_modules/.bin launcher that a global install also makes"
replaces = "none"
checked = 2026-11-23

[[tool]]
id = "repository-tests"
risk = "regressions in the gate, release preflight, installer attestation, public install smoke, SDK version, and npm packaging scripts; a release installer that installs the wrong version"
tool = "repository test scripts"
version = "repository"
unpinned = "repository scripts, versioned by commit"
commands = ["scripts/check-all.sh", "scripts/test-check-all.sh", "scripts/test-check-sdk-versions.sh", "scripts/cargo-audit-version.sh", "scripts/test-release-preflight.sh", "scripts/test-installed-release-attestation.py", "scripts/test-installed-release-attestation-workflow.py", "scripts/test-real-user-public-install-smoke.py", "scripts/npm-packages.sh", "release-tooling/scripts/validate-publish-boundary.sh", "cargo-home/bin/logbrew"]
runs_in = "CI check job; release and publish workflows"
config = "each script"
conflicts = "none known"
exceptions = "none"
runtime = "SDK versions step: push n=5, max 5 s; pull request n=6, max 3 s"
findings = "unknown: no recorded finding"
replaces = "none"
checked = 2026-11-19

[[tool]]
id = "public-guard"
risk = "secrets or non-public text in commits, paths, branch names, and pull request text; tracked Markdown that users do not need"
tool = "gitleaks with the public guard rules"
version = "8.30.1"
pins = ["scripts/public-guard.sh::readonly gitleaks_version=\"@VERSION@\"", "scripts/public-guard.sh::e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080", "scripts/public-guard.sh::551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"]
commands = ["scripts/public-guard.sh", "scripts/test-public-guard.sh"]
runs_in = "Public guard workflow (required status) on every pull request and push"
config = "scripts/public-guard.toml"
conflicts = "none known"
exceptions = "false positives are fixed in their own pull request"
runtime = "see the Public guard workflow runs"
findings = "unknown: findings are fixed before merge"
replaces = "none"
checked = 2026-11-19

[[tool]]
id = "release-actions"
risk = "release artifact, attestation, and publishing supply chain"
tool = "GitHub actions used by the release and publish workflows"
version = "pinned in the workflows"
unpinned = "each workflow pins the commit with a version comment; the check requires one such pin per action"
uses = ["actions/attest-build-provenance", "actions/download-artifact", "actions/upload-artifact", "rust-lang/crates-io-auth-action", "./.github/workflows/publish-npm-trusted.yml", "./.github/workflows/publish-homebrew-tap.yml", "actions/checkout"]
commands = ["cargo publish"]
runs_in = "every workflow (checkout); release and publish workflows"
config = "release.yml, publish-*.yml"
conflicts = "none known"
exceptions = "none"
runtime = "release jobs; see the Release workflow runs"
findings = "not a check; supply-chain pins"
replaces = "none"
checked = 2026-11-19

[[tool]]
id = "tool-matrix"
risk = "a gate tool without an entry, a pin that differs from its entry, an entry not checked for 30 days"
tool = "scripts/check-tool-matrix.sh and its seeded tests"
version = "repository"
unpinned = "repository script, versioned by commit"
commands = ["scripts/check-tool-matrix.sh", "scripts/test-check-tool-matrix.sh"]
runs_in = "CI check job (scripts/check-all.sh)"
config = "this file"
conflicts = "reads commands with a small shell reader; a command built at run time is invisible to it"
exceptions = "none"
runtime = "new; record from CI runs at the next check"
findings = "seeded: an unlisted command, a changed pin, a changed action commit, a stale or future date, and a missing field each fail"
replaces = "none"
checked = 2026-11-19

[[tool]]
id = "dependabot-coverage"
risk = "a dependency or tool manifest that Dependabot never updates, or an entry that is not daily, has no 7-day cooldown, or splits updates into many pull requests"
tool = "scripts/check-dependabot.sh and its seeded tests"
version = "repository"
unpinned = "repository script, versioned by commit"
commands = ["scripts/check-dependabot.sh", "scripts/test-check-dependabot.sh"]
runs_in = "CI check job (scripts/check-all.sh)"
config = ".github/dependabot.yml"
conflicts = "reads a YAML subset with a small awk reader; a glob in `directories` fails, so every directory is listed"
exceptions = "none"
runtime = "new; record from CI runs at the next check"
findings = "seeded: an unlisted manifest directory, an unlisted Cargo workspace root, a listed directory without a manifest, a glob, a second entry for one ecosystem, a weekly schedule, a missing cooldown, and ungrouped updates each fail"
replaces = "none"
checked = 2026-11-21

[[tool]]
id = "suppressions"
risk = "an inline lint or type suppression that hides a finding instead of fixing it"
tool = "scripts/check-suppressions.sh and its seeded tests"
version = "repository"
unpinned = "repository script, versioned by commit"
commands = ["scripts/check-suppressions.sh", "scripts/test-check-suppressions.sh"]
runs_in = "CI check job (scripts/check-all.sh)"
config = "the pattern in scripts/check-suppressions.sh"
conflicts = "none known"
exceptions = "none"
runtime = "new; record from CI runs at the next check"
findings = "seeded: each suppression form fails with its path and line; a clean repository passes; a directory outside Git fails"
replaces = "none"
checked = 2026-11-18

[[tool]]
id = "openssf-scorecard"
risk = "Supply chain practices drifting: unpinned actions, write tokens, branch protection, dangerous workflows"
tool = "OpenSSF Scorecard action and the CodeQL SARIF upload"
version = "pinned in the workflows"
unpinned = "the scorecard workflow pins each action to a commit with a version comment; the check requires one such pin per action"
uses = ["ossf/scorecard-action", "github/codeql-action/upload-sarif"]
runs_in = "scorecard workflow: pushes to main, weekly, and branch protection changes"
config = "publish_results: true; results go to the OpenSSF API and to code scanning"
conflicts = "none known"
exceptions = "none"
runtime = "not yet recorded; the workflow is new"
findings = "unknown: the first run publishes the baseline; record low checks at the next review"
replaces = "none"
checked = 2026-10-30

[[tool]]
id = "zizmor"
risk = "GitHub Actions workflows, actions, and Dependabot settings that an attacker can turn against the repository: template injection, broad token permissions, persisted credentials, dangerous triggers, cache poisoning, and unpinned or known-vulnerable actions"
tool = "zizmor through zizmorcore/zizmor-action"
version = "1.32.0"
unpinned = "the zizmor workflow pins zizmorcore/zizmor-action to a commit with a version comment; that commit's lock file pins zizmor by version and wheel hashes, so a Dependabot update of the action updates zizmor"
uses = ["zizmorcore/zizmor-action"]
runs_in = "zizmor workflow: every pull request and push to main"
config = ".github/zizmor.yml; regular persona with online audits; every finding fails the run"
conflicts = "none known"
exceptions = ".github/zizmor.yml gives each reason: dangerous-triggers in public-guard.yml and public-text-guard.yml (the guard needs the term list on fork pull requests and never runs their content); self-repository in release.yml (actionlint 1.7.12 rejects the $/ form of a reusable workflow call); github-env and adhoc-packages in action.yml (the action installs the CLI version the caller picks and puts it on PATH)"
runtime = "not yet recorded; the workflow is new"
findings = "2026-11-21 before: 21 (3 dangerous-triggers, 3 dependabot-cooldown, 3 ref-version-mismatch, 2 secrets-inherit, 2 self-repository, 4 adhoc-packages, 1 template-injection, 1 cache-poisoning, 1 github-env, 1 artipacked); after: 0, with 10 ignored; a seeded workflow with template injection and an unpinned action fails the run. 2026-11-23: 7 ignored, since the npm-install job installs through npm ci"
replaces = "none"
checked = 2026-11-21

[[tool]]
id = "fuzzing"
risk = "a crash, hang, or memory error in the command-line parser, the ELF and Mach-O debug file parser, or the symbol ZIP reader on unexpected input"
tool = "ClusterFuzzLite with cargo-fuzz and libFuzzer (AddressSanitizer)"
version = "1"
pins = [".github/workflows/fuzz.yml::google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v@VERSION@", ".clusterfuzzlite/Dockerfile::base-builder-rust:v@VERSION@@sha256:"]
uses = ["google/clusterfuzzlite/actions/build_fuzzers", "google/clusterfuzzlite/actions/run_fuzzers"]
runs_in = "Fuzz workflow: every pull request (changed code) and push to main (every target), 300 s in all"
config = ".clusterfuzzlite/ and fuzz/; the image pins its Rust nightly"
conflicts = "none known"
exceptions = "none"
runtime = "not yet recorded; the workflow is new"
findings = "2026-11-23: each target ran 300 s on a local build before the workflow landed; see the pull request that added it"
replaces = "none"
checked = 2026-11-23
